[package]
name = "ajax"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-core = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketcan = "3.6.2"

axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
